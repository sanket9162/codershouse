
services:

  backend:
    image: codershouse-backend:1.0.0
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: codershouse-backend-dev
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app

  frontend:
    image: codershouse-frontend:1.0.0
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: codershouse-frontend-dev
    ports:
      - "5173:5173"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json

volumes:
  mongo-data-dev:
